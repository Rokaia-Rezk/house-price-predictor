<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>House Price Predictor</title>
    <!-- Import Google Fonts for elegant typography -->
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; font-family: 'Poppins', 'Segoe UI', Tahoma, sans-serif; }
        
        body {
            background: linear-gradient(135deg, #f3eef9 0%, #e2d4f2 50%, #f6f3fc 100%);
            background-size: cover;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; margin: 0; padding: 15px; position: relative; overflow-x: hidden;
        }

        /* Falling violet petals aesthetic animation */
        .petal {
            position: fixed;
            top: -10vh;
            background: linear-gradient(135deg, #d8b4fe, #a855f7);
            border-radius: 150% 0 150% 0;
            animation: fall linear infinite;
            z-index: 1;
            opacity: 0.6;
            pointer-events: none;
        }

        @keyframes fall {
            0% {
                transform: translateY(-10vh) translateX(0) rotate(0deg);
                opacity: 0.8;
            }
            50% {
                transform: translateY(50vh) translateX(50px) rotate(180deg);
                opacity: 0.5;
            }
            100% {
                transform: translateY(110vh) translateX(-50px) rotate(360deg);
                opacity: 0;
            }
        }

        .floral-top-left {
            position: fixed; top: -30px; left: -30px; width: 320px; height: 320px;
            background: radial-gradient(circle, rgba(192, 132, 252, 0.35) 0%, rgba(255,255,255,0) 70%);
            border-radius: 50%; pointer-events: none; z-index: 1; filter: blur(20px);
        }
        .floral-bottom-right {
            position: fixed; bottom: -40px; right: -40px; width: 380px; height: 380px;
            background: radial-gradient(circle, rgba(168, 85, 247, 0.3) 0%, rgba(255,255,255,0) 75%);
            border-radius: 50%; pointer-events: none; z-index: 1; filter: blur(25px);
        }
        .floral-pattern-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: radial-gradient(rgba(147, 51, 234, 0.12) 1.5px, transparent 1.5px), radial-gradient(rgba(192, 132, 252, 0.15) 1.5px, transparent 1.5px);
            background-size: 60px 60px; background-position: 0 0, 30px 30px; pointer-events: none; z-index: 1;
        }
        
        /* Professional header badge for engineer's name */
        .header-name {
            position: absolute; top: 15px; right: 20px;
            background: rgba(238, 230, 249, 0.85); backdrop-filter: blur(14px);
            padding: 6px 15px; border-radius: 20px; color: #581c87; font-weight: bold; font-size: 0.95rem;
            box-shadow: 0 4px 20px rgba(107, 33, 168, 0.2); border: 1px solid rgba(216, 180, 254, 0.8); z-index: 10;
            letter-spacing: 0.5px;
        }
        .header-name span {
            font-family: 'Dancing Script', cursive;
            font-size: 1.2rem;
            color: #7c3aed;
            margin-left: 5px;
        }

        .container { 
            background: rgba(245, 240, 253, 0.78); backdrop-filter: blur(18px);
            padding: 25px; border-radius: 22px; box-shadow: 0 10px 40px rgba(91, 33, 182, 0.22); 
            width: 100%; max-width: 600px; border: 1.5px solid rgba(224, 204, 250, 0.85); z-index: 2;
        }
        h2 { color: #581c87; text-align: center; margin-bottom: 20px; font-size: 1.4rem; }
        
        .grid { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 12px; 
        }
        
        .form-group { display: flex; flex-direction: column; }
        label { font-size: 0.8rem; font-weight: bold; margin-bottom: 4px; color: #3b0764; }
        input, select { 
            padding: 9px; border: 1px solid rgba(192, 132, 252, 0.65); border-radius: 10px; 
            font-size: 0.9rem; background: rgba(255, 255, 255, 0.85); color: #3b0764; font-weight: 600; outline: none;
        }
        button { 
            grid-column: span 2; padding: 12px; background: linear-gradient(135deg, #7c3aed, #9333ea); 
            color: white; border: none; border-radius: 10px; font-size: 1rem; font-weight: bold; cursor: pointer; margin-top: 10px; 
            transition: all 0.3s ease;
        }
        button:hover { background: linear-gradient(135deg, #6d28d9, #7e22ce); transform: translateY(-1px); }
        .result { 
            margin-top: 15px; padding: 14px; background: rgba(237, 223, 255, 0.9); 
            border: 1px solid rgba(192, 132, 252, 0.95); border-radius: 12px; text-align: center; color: #4c1d95; font-weight: bold; font-size: 1.15rem; 
        }

        /* Mobile Screen Perfect Fit */
        @media (max-width: 600px) {
            body {
                padding: 10px;
                align-items: center;
            }
            .container {
                padding: 15px;
                max-width: 100%;
            }
            .grid {
                grid-template-columns: 1fr 1fr !important;
                gap: 8px !important;
            }
            .form-group[style*="grid-column: span 2;"] {
                grid-column: span 2 !important;
            }
            button {
                grid-column: span 2 !important;
            }
            input, select {
                padding: 7px;
                font-size: 0.8rem;
            }
            label {
                font-size: 0.72rem;
            }
        }
    </style>
</head>
<body>
    <!-- Aesthetic Background Elements -->
    <div class="floral-top-left"></div>
    <div class="floral-bottom-right"></div>
    <div class="floral-pattern-bg"></div>

    <!-- Featured Engineer Badge -->
    <div class="header-name">✨ ENG. <span>Rokaia Rezk</span></div>

    <div class="container">
        <h2>🏡 Real Estate Price Predictor</h2>
        <form id="predictForm">
            <div class="grid">
                <div class="form-group">
                    <label>Carpet Area (sqft)</label>
                    <input type="number" id="carpet_area_sqft" value="1200" required>
                </div>
                <div class="form-group">
                    <label>Bedrooms</label>
                    <input type="number" id="bedrooms" value="2" required>
                </div>
                <div class="form-group">
                    <label>Bathrooms</label>
                    <input type="number" id="bathroom" value="2" required>
                </div>
                <div class="form-group">
                    <label>Balconies</label>
                    <input type="number" id="balcony" value="1" required>
                </div>
                <div class="form-group">
                    <label>Floor Number</label>
                    <input type="number" id="floor_num" value="2" required>
                </div>
                <div class="form-group">
                    <label>Total Floors</label>
                    <input type="number" id="total_floors" value="5" required>
                </div>
                <div class="form-group">
                    <label>Location</label>
                    <select id="location_grouped">
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Furnishing</label>
                    <select id="Furnishing">
                        <option value="Semi-Furnished">Semi-Furnished</option>
                        <option value="Furnished">Furnished</option>
                        <option value="Unfurnished">Unfurnished</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Facing</label>
                    <select id="facing">
                        <option value="North">North</option>
                        <option value="South">South</option>
                        <option value="East">East</option>
                        <option value="West">West</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Transaction</label>
                    <select id="Transaction">
                        <option value="Resale">Resale</option>
                        <option value="New Property">New Property</option>
                    </select>
                </div>
                <div class="form-group" style="grid-column: span 2;">
                    <label>Ownership</label>
                    <select id="Ownership">
                        <option value="Freehold">Freehold</option>
                        <option value="Leasehold">Leasehold</option>
                    </select>
                </div>
                <button type="submit">Predict Price ✨</button>
            </div>
        </form>
        <div id="resultBox" class="result" style="display:none;"></div>
    </div>

    <script>
        const API_BASE = window.location.hostname === '127.0.0.1' || window.location.hostname === 'localhost'
            ? 'http://127.0.0.1:8000' 
            : 'https://alluring-wisdom-production-6322.up.railway.app';

        function createPetals() {
            const petalsCount = 18;
            for (let i = 0; i < petalsCount; i++) {
                const petal = document.createElement('div');
                petal.classList.add('petal');
                const size = Math.random() * 12 + 8;
                petal.style.width = `${size}px`;
                petal.style.height = `${size * 1.5}px`;
                petal.style.left = `${Math.random() * 100}vw`;
                petal.style.animationDuration = `${Math.random() * 5 + 4}s`;
                petal.style.animationDelay = `${Math.random() * 5}s`;
                document.body.appendChild(petal);
            }
        }
        createPetals();

        async function loadLocations() {
            try {
                const response = await fetch(`${API_BASE}/locations.json`);
                if (!response.ok) return;
                const locations = await response.json();
                const select = document.getElementById('location_grouped');
                select.innerHTML = '<option value="Other">Other</option>';
                locations.forEach(loc => {
                    const opt = document.createElement('option');
                    opt.value = loc;
                    opt.textContent = loc.charAt(0).toUpperCase() + loc.slice(1);
                    select.appendChild(opt);
                });
            } catch (e) {
                console.error("Error loading locations:", e);
            }
        }
        loadLocations();

        document.getElementById('predictForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const resultBox = document.getElementById('resultBox');
            resultBox.style.display = 'block';
            resultBox.innerText = 'Calculating... ⏳';

            const payload = {
                carpet_area_sqft: parseFloat(document.getElementById('carpet_area_sqft').value),
                bedrooms: parseInt(document.getElementById('bedrooms').value),
                bathroom: parseInt(document.getElementById('bathroom').value),
                balcony: parseInt(document.getElementById('balcony').value),
                floor_num: parseInt(document.getElementById('floor_num').value),
                total_floors: parseInt(document.getElementById('total_floors').value),
                location_grouped: document.getElementById('location_grouped').value,
                Furnishing: document.getElementById('Furnishing').value,
                facing: document.getElementById('facing').value,
                Transaction: document.getElementById('Transaction').value,
                Ownership: document.getElementById('Ownership').value
            };

            try {
                const response = await fetch(`${API_BASE}/predict`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const resData = await response.json();
                if (response.ok) {
                    resultBox.innerText = `Predicted Price: ₹ ${resData.prediction.toLocaleString('en-IN', {maximumFractionDigits: 2})}`;
                } else {
                    resultBox.innerText = `Error: ${resData.detail || 'Making prediction failed'}`;
                }
            } catch (err) {
                resultBox.innerText = 'Server Error! Make sure FastAPI is running.';
            }
        });
    </script>
</body>
</html>
